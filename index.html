<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Azura — Student Market</title>
<link rel="icon" type="image/png" href="assets/logo-tile.png">
<meta name="theme-color" content="#ffffff">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--p:#7000FF;--pd:#5a00d1;--y:#ffe600;--bg:#f2f2f7;--red:#ff3b5c;--gr:#00a651;--or:#ff8a00}
body{background:var(--bg);color:#16161a;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px}
button{border:none;cursor:pointer;font-family:inherit;background:none}
input,select,textarea{font-family:inherit;font-size:15px}
.header{background:linear-gradient(135deg,var(--p),#9b4dff);padding:14px;color:#fff;border-radius:0 0 20px 20px;position:sticky;top:0;z-index:30}
.top{display:flex;justify-content:center;align-items:center;font-size:13px}
.logo{font-size:21px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.logo span{color:var(--y)}
.search{margin-top:11px;background:#fff;border-radius:12px;padding:11px 13px;color:#8e8e93;font-size:14px;display:flex;gap:8px;align-items:center}
.search input{border:none;outline:none;flex:1;color:#16161a;background:none;font-size:14px}
.bell{position:relative;font-size:19px}
.bell i{position:absolute;top:-3px;right:-4px;width:9px;height:9px;background:var(--red);border-radius:50%;border:2px solid #8b3dff}
.popq{display:flex;gap:7px;padding:10px 14px 0;flex-wrap:wrap}
.popq span{font-size:12px;color:#666;align-self:center}
.popq button{background:#fff;border:1px solid #e4e4ea;padding:6px 11px;border-radius:16px;font-size:12.5px;color:#333}
.banner{margin:14px;background:linear-gradient(120deg,var(--y),#ffb800);border-radius:16px;padding:16px}
.banner b{font-size:19px;display:block;line-height:1.3}
.banner small{font-size:12.5px;opacity:.8}
.banner .chip{display:inline-block;margin-top:9px;background:var(--p);color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.cats{display:flex;gap:4px;padding:2px 8px 4px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{min-width:58px;text-align:center;font-size:10.5px;color:#333;cursor:pointer}
.cat .ic{width:50px;height:50px;border-radius:50%;background:#fff;overflow:hidden;margin:0 auto 5px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cat .ic img{width:100%;height:100%;object-fit:cover;display:block}
.cat.on .ic{outline:2.5px solid var(--p)}
.cat.on{color:var(--p);font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:center;padding:16px 14px 8px}
.sec b{font-size:17px}.sec a{font-size:12.5px;color:var(--p);font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.hscroll{display:flex;gap:10px;padding:2px 12px 6px;overflow-x:auto;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{min-width:158px;max-width:158px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer}
.ph{height:138px;position:relative;overflow:hidden;background:#ececf1}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;z-index:2}
.badge.new{background:var(--gr)}
.fav{position:absolute;top:4px;right:8px;font-size:19px;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.45);z-index:2}
.fav.on{color:var(--red);text-shadow:none}
.info{padding:9px 10px 11px}
.price{color:var(--p);font-weight:800;font-size:15px;white-space:nowrap}
.old{color:#aeaeb2;font-size:11.5px;text-decoration:line-through;display:block;margin-top:1px}
.inst{font-size:11px;color:#7a4d00;background:#fff6d8;border-radius:6px;padding:3px 6px;margin-top:5px;display:inline-block}
.pname{font-size:12.8px;color:#222;margin-top:5px;line-height:1.3;min-height:33px}
.rate{font-size:11px;color:#ff9500;margin-top:3px}
.rate i{color:#aeaeb2;font-style:normal}
.stockline{font-size:11px;margin-top:3px;color:var(--gr)}
.stockline.low{color:var(--or);font-weight:700}
.add{margin-top:8px;background:var(--p);color:#fff;text-align:center;padding:9px;border-radius:9px;font-size:12.5px;font-weight:700;width:100%}
.added{background:#e9e2ff;color:var(--p)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:9px 0 12px;border-top:1px solid #e8e8ec;z-index:40}
.nav button{font-size:10.5px;color:#8e8e93;text-align:center;position:relative}
.nav button div{font-size:20px;line-height:1.25}
.nav button.on{color:var(--p);font-weight:700}
.nav .cnt{position:absolute;top:-4px;right:4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.page{padding:14px}
.ptitle{font-size:20px;font-weight:800;margin-bottom:12px}
.back{font-size:15px;color:var(--p);font-weight:600;padding:12px 14px 8px;display:block;text-align:left}
/* galereya */
.gal{position:relative;background:#ececf1;border-radius:0 0 22px 22px;overflow:hidden}
.gal img.main{width:100%;height:330px;object-fit:cover;display:block}
.gal .badge{font-size:12.5px;padding:5px 9px}
.thumbs{display:flex;gap:8px;padding:10px 14px 0}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:10px;cursor:pointer;opacity:.65;border:2px solid transparent}
.thumbs img.on{opacity:1;border-color:var(--p)}
.gcount{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;padding:3px 9px;border-radius:12px}
.pbody{padding:14px 16px}
.pprice{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.pprice .price{font-size:23px}
.pprice .old{display:inline;font-size:14.5px;margin:0}
.disc{background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:7px}
.instbox{background:#f4efff;border:1px solid #e0d1ff;border-radius:12px;padding:11px 13px;margin-top:12px;font-size:13.5px;line-height:1.5}
.instbox b{color:var(--p)}
.pbody h2{font-size:18.5px;margin:10px 0 4px;line-height:1.35}
.desc{font-size:14px;color:#444;line-height:1.6;margin-top:9px;white-space:pre-line}
.opt{margin-top:15px}
.opt b{font-size:13.5px;display:block;margin-bottom:8px}
.selrow{display:flex;gap:8px;flex-wrap:wrap}
.sel{padding:8px 14px;border:1.5px solid #dddde3;border-radius:10px;background:#fff;font-size:13.5px;font-weight:600;position:relative}
.sel.on{border-color:var(--p);color:var(--p);background:#f4efff}
.sel.out{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.sel .os{position:absolute;top:-7px;right:-5px;background:#8e8e93;color:#fff;font-size:8.5px;padding:1px 5px;border-radius:7px;text-decoration:none}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:36px;height:36px;border-radius:50%;background:#eeeef2;font-size:19px;font-weight:700}
.qty b{font-size:17px}
.infocard{background:#fff;border-radius:14px;padding:13px 14px;margin-top:14px;font-size:13.5px;line-height:1.55}
.infocard b.t{display:block;font-size:14px;margin-bottom:6px}
.infocard .row{display:flex;gap:9px;padding:5px 0;color:#444}
.infocard .row span:first-child{font-size:16px}
.seller{display:flex;gap:11px;align-items:center}
.sava{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--p),#9b4dff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.rev{border-top:1px solid #f0f0f3;padding:11px 0}
.rev:first-of-type{border-top:none}
.rev .rh{display:flex;justify-content:space-between;font-size:13px}
.rev .rn{font-weight:700}
.rev .rd{color:#aeaeb2;font-size:12px}
.rev .rt{font-size:13.5px;color:#333;line-height:1.5;margin-top:4px}
.verified{color:var(--gr);font-size:11px;font-weight:700}
.rbar{display:flex;align-items:center;gap:8px;font-size:12px;color:#666;margin:3px 0}
.rbar .tr{flex:1;height:7px;background:#eeeef2;border-radius:4px;overflow:hidden}
.rbar .fl{height:100%;background:#ff9500}
.buybar{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;padding:10px 12px;display:flex;gap:9px;align-items:center;z-index:35;box-shadow:0 -4px 18px rgba(0,0,0,.06)}
.buybar .bp{line-height:1.15}
.buybar .bp .price{font-size:16.5px}
.buybar .bp small{color:#8e8e93;font-size:11px}
.buybar .add{flex:1;margin:0;padding:13px;font-size:14.5px;border-radius:11px}
.buybar .now{flex:1;background:#16161a;color:#fff;padding:13px;font-size:14.5px;border-radius:11px;font-weight:700}
.hbtn{width:46px;height:46px;border-radius:11px;background:#f2f2f5;font-size:20px;flex-shrink:0}
/* savat */
.crow{background:#fff;border-radius:14px;padding:11px;display:flex;gap:11px;margin-bottom:10px;align-items:center}
.cph{width:66px;height:66px;border-radius:11px;overflow:hidden;flex-shrink:0;background:#ececf1}
.cph img{width:100%;height:100%;object-fit:cover;display:block}
.crow .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.crow .vr{font-size:11.5px;color:#8e8e93;margin-top:2px}
.crow .pr{color:var(--p);font-weight:800;font-size:14px;margin-top:4px}
.del{color:#c7c7cc;font-size:17px;align-self:flex-start}
.later{font-size:11.5px;color:var(--p);font-weight:600;margin-top:5px}
.sum{background:#fff;border-radius:14px;padding:14px;margin-top:4px;font-size:14px}
.sum div{display:flex;justify-content:space-between;padding:4px 0;color:#555}
.sum .tot{border-top:1px dashed #e3e3e8;margin-top:8px;padding-top:10px;color:#16161a;font-weight:800;font-size:16px}
.sum .discrow{color:var(--gr);font-weight:700}
.cta{width:100%;background:var(--p);color:#fff;padding:15px;border-radius:13px;font-size:15.5px;font-weight:800;margin-top:12px}
.empty{text-align:center;padding:52px 20px;color:#8e8e93}
.empty .em{font-size:60px;margin-bottom:12px}
.empty b{color:#333;display:block;font-size:17px;margin-bottom:5px}
.prog{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;font-size:13px}
.prog .tr{height:9px;background:#eeeef2;border-radius:5px;overflow:hidden;margin-top:8px}
.prog .fl{height:100%;background:linear-gradient(90deg,var(--p),#9b4dff);border-radius:5px;transition:.3s}
.promo{display:flex;gap:8px;margin-bottom:10px}
.promo input{flex:1;padding:12px;border:1.5px solid #e0e0e6;border-radius:12px;background:#fff;outline:none;text-transform:uppercase}
.promo button{background:#16161a;color:#fff;padding:0 18px;border-radius:12px;font-weight:700;font-size:13.5px}
/* forma */
.fld{margin-bottom:12px}
.fld label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;padding:13px;border:1.5px solid #e0e0e6;border-radius:12px;background:#fff;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--p)}
.payrow{display:flex;gap:9px}
.pay{flex:1;background:#fff;border:1.5px solid #e0e0e6;border-radius:12px;padding:12px 6px;text-align:center;font-size:13px;font-weight:700;cursor:pointer}
.pay.on{border-color:var(--p);color:var(--p);background:#f4efff}
.pay div{font-size:20px;margin-bottom:4px}
.pay small{display:block;font-weight:400;color:#8e8e93;font-size:10.5px;margin-top:2px}
.mrow{display:flex;gap:9px}
.meth{flex:1;background:#fff;border:1.5px solid #e0e0e6;border-radius:12px;padding:12px;text-align:left;cursor:pointer;font-size:13.5px}
.meth.on{border-color:var(--p);background:#f4efff}
.meth b{display:block;font-size:14px;margin-bottom:2px}
.meth small{color:#8e8e93;font-size:11.5px;line-height:1.4;display:block}
/* buyurtmalar */
.ord{background:#fff;border-radius:14px;padding:14px;margin-bottom:11px}
.ord .oh{display:flex;justify-content:space-between;font-size:13px;color:#8e8e93;align-items:center}
.ord .oh b{color:#16161a;font-size:14.5px}
.tl{display:flex;margin:14px 0 4px}
.tl .st{flex:1;text-align:center;position:relative;font-size:9.8px;color:#aeaeb2;padding-top:15px;line-height:1.25}
.tl .st:before{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:#e3e3e8;z-index:2}
.tl .st:after{content:"";position:absolute;top:9px;left:calc(-50% + 6px);width:calc(100% - 12px);height:2.5px;background:#e3e3e8}
.tl .st:first-child:after{display:none}
.tl .st.done{color:var(--p);font-weight:700}
.tl .st.done:before{background:var(--p)}
.tl .st.done:after{background:var(--p)}
.oimgs{display:flex;gap:7px;margin-top:11px}
.oimgs img{width:46px;height:46px;border-radius:9px;object-fit:cover}
.ord .oi{font-size:13px;margin-top:9px;line-height:1.55;color:#333}
.ord .ot{font-weight:800;margin-top:7px;font-size:15px}
.ord .om{font-size:12.5px;color:#8e8e93;margin-top:3px;line-height:1.5}
.obtns{display:flex;gap:8px;margin-top:11px}
.obtns button{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:700;background:#f2f2f5;color:#333}
.obtns .cancel{color:var(--red)}
.stbadge{font-weight:700;padding:3px 9px;border-radius:12px;font-size:11.5px;background:#fff4d6;color:#9a7400}
.stbadge.cx{background:#ffe3e9;color:#c2183f}
/* profil */
.prof{background:#fff;border-radius:16px;padding:18px 14px;display:flex;gap:13px;align-items:center}
.pava{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--p),#9b4dff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex-shrink:0}
.menu{background:#fff;border-radius:14px;margin-top:12px;overflow:hidden}
.menu button{display:flex;width:100%;padding:15px 14px;font-size:14.5px;justify-content:space-between;border-bottom:1px solid #f2f2f5;text-align:left;color:#16161a}
.menu button:last-child{border-bottom:none}
.ok{text-align:center;padding:44px 22px}
.ok .em{font-size:72px}
.ok h2{font-size:21px;margin:14px 0 8px}
.ok p{color:#666;font-size:14px;line-height:1.55}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(20px);background:#16161a;color:#fff;padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chips{display:flex;gap:8px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip2{padding:8px 14px;border-radius:20px;background:#fff;font-size:13px;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.chip2.on{background:#16161a;color:#fff;font-weight:600}
select.sortsel{padding:9px 12px;border-radius:11px;border:1.5px solid #e0e0e6;background:#fff;font-size:13.5px;outline:none}
.sztable{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.sztable td,.sztable th{border:1px solid #eee;padding:7px;text-align:center;color:#444}
.sztable th{background:#f7f7fa}
</style>

<style>
body{background:#f3f3f7}
#app{animation:fin .28s ease}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.header{box-shadow:0 6px 22px rgba(112,0,255,.28)}
.card{border-radius:17px;box-shadow:0 4px 16px rgba(23,0,60,.07)}
.ph{height:152px}
.cat .ic{border:2.5px solid #fff;box-shadow:0 5px 14px rgba(112,0,255,.22)}
.sec b{font-size:18px;letter-spacing:-.2px}
.nav{box-shadow:0 -6px 22px rgba(0,0,0,.06)}
.hero{margin:12px 12px 2px;border-radius:19px;overflow:hidden;position:relative;height:172px;box-shadow:0 10px 26px rgba(23,0,60,.16)}
.htrack{display:flex;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.hslide{min-width:100%;height:100%;position:relative;cursor:pointer}
.hslide img{width:100%;height:100%;object-fit:cover;display:block}
.hoverlay{position:absolute;inset:0;background:linear-gradient(92deg,rgba(12,0,32,.66),rgba(12,0,32,.08) 68%);color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.hoverlay b{font-size:20px;line-height:1.22;max-width:235px}
.hoverlay small{font-size:12.5px;opacity:.94;margin-top:5px;max-width:225px;line-height:1.4}
.hoverlay .go{margin-top:11px;background:var(--y);color:#16161a;font-weight:800;font-size:12.5px;padding:8px 15px;border-radius:20px}
.hdots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:5px;justify-content:center;z-index:3}
.hdot{width:6px;height:6px;border-radius:4px;background:rgba(255,255,255,.55);cursor:pointer;transition:.3s}
.hdot.on{background:#fff;width:18px}
.cdpill{background:var(--red);color:#fff;padding:5px 11px;border-radius:15px;font-size:12px;font-weight:700;box-shadow:0 4px 12px rgba(255,59,92,.35)}
.soldbar{height:6px;background:#ffe9ee;border-radius:4px;margin-top:7px;overflow:hidden}
.soldbar div{height:100%;background:linear-gradient(90deg,#ff3b5c,#ff7a5c);border-radius:4px}
.soldtxt{font-size:10.5px;color:#c2183f;margin-top:3px;font-weight:600}
.gbtns{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.gb{width:39px;height:39px;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.gal{border-radius:0}
.pbody{background:#fff;border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:2;box-shadow:0 -6px 22px rgba(0,0,0,.05)}
.pbody .infocard{background:#fafaff;border:1px solid #f0eefc}
.buybar{box-shadow:0 -6px 22px rgba(0,0,0,.09)}
input:focus,select:focus,textarea:focus{border-color:var(--p)!important;box-shadow:0 0 0 3px rgba(112,0,255,.12)}
.gal .badge{top:58px;left:12px}
body{overscroll-behavior:none}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
.header{padding-top:calc(3px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
.fs-logo{position:fixed;top:var(--fs-top,0px);left:0;right:0;height:var(--fs-h,0px);display:none;align-items:center;justify-content:center;pointer-events:none;z-index:200;overflow:hidden}
html[data-tg-fs="1"] .fs-logo{display:flex}
.fs-logo{gap:7px}.fs-logo .fsic{height:34px;width:34px;border-radius:9px;display:block}.fs-logo .fstx{font-size:17.5px;font-weight:800;letter-spacing:-.2px;color:#101013}
.tg .back{display:none}
.nav{bottom:10px;width:calc(100% - 20px);border-radius:24px;border:1px solid #ececf1;box-shadow:0 12px 32px rgba(23,0,60,.16);padding:8px 0 9px}
body{padding-bottom:104px}
.buybar{bottom:92px;border-radius:18px;width:calc(100% - 16px);border:1px solid #f0f0f4;box-shadow:0 12px 30px rgba(23,0,60,.15)}
.toast{bottom:196px}
.card{transition:transform .13s ease}
.card:active{transform:scale(.98)}
.cat:active,.chip2:active,.sel:active{transform:scale(.96)}
.add:active,.cta:active{transform:scale(.985)}
.chip2,.sel,.cat{transition:transform .12s ease}

 <div class="sec"><b>Ko'p sotilayotganlar</b><a onclick="go('#/catalog')">Hammasi →</a></div>
 <div class="grid" id="grid">${(query?filtered():top).map(card).join('')||emptyGrid()}</div>
 ${query?'':`
 <div class="sec"><b>Yangi kelganlar</b></div>
 <div class="hscroll">${yang.map(card).join('')}</div>
 <div class="sec"><b>Hafta taklifi</b><span class="cdpill" id="cd">hisoblanmoqda…</span></div>

}

 <div class="pbody">

 <div class="instbox">${ico('cash','sm')} <b>Bo'lib to'lash:</b> 3 oyga, oyiga <b>${fmt(inst(p))}</b> dan<br><small style="color:#8e8e93">Yoki bir yo'la to'liq to'lov — qanday qulay bo'lsa.</small></div>

 <div class="rate" style="font-size:13px">★ ${p.rate} <i>• ${p.rev} ta sharh • ${p.sold} marta sotilgan</i></div>

 <div class="opt"><b>${p.olab}:</b><div class="selrow">${p.opts.map(o=>p.out.includes(o)?`<button class="sel out">${o}<span class="os">tugagan</span></button>`:`<button class="sel ${selOpt[p.id]===o?'on':''}" onclick="selOpt[${p.id}]='${o}';render()">${o}</button>`).join('')}</div></div>
 ${p.cat==='poyabzal'?`<div class="opt"><b>📏 O'lcham jadvali (sm):</b><table class="sztable"><tr><th>40</th><th>41</th><th>42</th><th>43</th><th>44</th><th>45</th></tr><tr><td>25.5</td><td>26</td><td>26.5</td><td>27.5</td><td>28</td><td>28.5</td></tr></table></div>`:''}
 <div class="opt"><b>Miqdor:</b><div class="qty"><button onclick="selQty=Math.max(1,selQty-1);render()">−</button><b>${selQty}</b><button onclick="selQty=Math.min(${p.stock},selQty+1);render()">+</button><span style="color:#8e8e93;font-size:12.5px">${p.stock} dona bor</span></div></div>
 <div class="infocard"><b class="t">${ico('truck')} Yetkazib berish</b>
 <div class="row"><span style="color:var(--p)">${ico('home','sm')}</span><span><b>Kuryer</b> — ertaga, <b>${dateStr(1)}</b>, Toshkent bo'ylab (300 mingdan oshsa bepul)</span></div>
 <div class="row"><span style="color:var(--p)">${ico('box','sm')}</span><span><b>Olib ketish punkti</b> — ${dateStr(2)} dan, bepul</span></div>
 <div class="row"><span style="color:var(--p)">${ico('ret','sm')}</span><span>To'g'ri kelmasa 14 kun ichida qaytarish mumkin</span></div></div>
 <div class="infocard"><b class="t">${ico('store')} Sotuvchi</b>
 <div class="seller"><div class="sava" style="background:#16161a;overflow:hidden;padding:0"><img src="assets/logo-tile.png" style="width:100%;height:100%;object-fit:cover;display:block"></div><div><b>Azura Market do'koni</b><div style="color:#8e8e93;font-size:12.5px">★ 4.8 • 1 200+ savdo • Javob vaqti: ~15 daqiqa</div></div></div>
 <p style="margin-top:8px;color:#666">Savol bo'lsa botga yozing — o'zimiz javob beramiz, bot emas, odam qaraydi 💬</p></div>
 <div class="infocard"><b class="t">${icoF('star')} Sharhlar (${p.rev})</b>
 <div style="display:flex;gap:16px;align-items:center;margin-bottom:6px"><div style="font-size:30px;font-weight:800">${p.rate}</div><div style="flex:1">${[5,4,3,2,1].map((s,i)=>`<div class="rbar"><span>${s}★</span><div class="tr"><div class="fl" style="width:${dist[i]}%"></div></div><span>${dist[i]}%</span></div>`).join('')}</div></div>
 ${p.reviews.map(r=>`<div class="rev"><div class="rh"><span class="rn">${r.n}</span><span class="rd">${r.d}</span></div><div style="color:#ff9500;font-size:12.5px">${starsHTML(r.s)} ${r.v?'<span class="verified">✓ Sotib olgan</span>':''}</div><div class="rt">${r.t}</div></div>`).join('')}
 </div>
 ${similar.length?`<div class="sec" style="padding-left:0"><b>O'xshash tovarlar</b></div><div class="hscroll" style="padding-left:0;padding-right:0">${similar.map(card).join('')}</div>`:''}
 <div style="height:64px"></div>
 </div>
 <div class="buybar"><button class="hbtn" onclick="toggleFav(${p.id})">${heartIco(S.favs.includes(p.id),true)}</button>
 <div class="bp"><span class="price">${fmt(p.price*selQty)}</span><br><small>${selQty} dona • ${p.olab.toLowerCase()}: ${selOpt[p.id]}</small></div>
 <button class="add" onclick="addCart(${p.id})">${inCart?'✓ Yangilash':'Savatga'}</button>
 <button class="now" onclick="buyNow(${p.id})">Hoziroq olish</button></div>`+nav('');
}
function addCart(id){const p=byId(id);S.cart[id]={id,qty:selQty,opt:selOpt[id]||p.opts[0]};save();toast('Savatga tushdi ✓');render();}
function buyNow(id){const p=byId(id);S.cart[id]={id,qty:selQty,opt:selOpt[id]||p.opts[0]};save();go('#/checkout');}

<script>
function delFee(sum){return sum>=300000?0:25000;}
function cartPage(){
 const items=Object.values(S.cart);
 if(!items.length)return `<div class="page"><div class="ptitle">Savat</div><div class="empty"><div class="em" style="color:#c9c9d1">${ico('cart','xl')}</div><b>Savat hozircha bo'sh</b>Yangi tovarlar kelgan, bir ko'rib chiqing</div><button class="cta" onclick="go('#/catalog')">Katalogga o'tish</button></div>`+nav('cart');
 const sum=goodsSum(),pd=promoDisc(),del=delFee(sum-pd),need=Math.max(0,300000-(sum-pd)),pct=Math.min(100,Math.round((sum-pd)/300000*100));
 return `<div class="page"><div class="ptitle">🛒 Savat</div>
 <div class="prog">${need>0?`Bepul yetkazishgacha yana <b>${fmt(need)}</b> qoldi`:`🎉 Yetkazish sizga <b>bepul</b> bo'ladi`}<div class="tr"><div class="fl" style="width:${pct}%"></div></div></div>
 ${items.map(c=>{const p=byId(c.id);return `<div class="crow"><div class="cph"><img src="${G}${p.imgs[0]}" alt=""></div>
 <div style="flex:1"><div class="nm">${p.name}</div><div class="vr">${p.olab}: ${c.opt} • Omborda ${p.stock} ta</div><div class="pr">${fmt(p.price*c.qty)}</div>
 <button class="later" onclick="later(${p.id})">Keyinroq olaman →</button></div>
 <div class="qty"><button onclick="setQty(${p.id},-1)">−</button><b>${c.qty}</b><button onclick="setQty(${p.id},1)">+</button></div>
 <button class="del" onclick="delete S.cart[${p.id}];save();render()">✕</button></div>`;}).join('')}
 <div class="promo"><input id="promo-in" placeholder="Promokod (masalan: KANAL10)" value="${S.promo}"><button onclick="applyPromo()">Qo'llash</button></div>
 ${S.promo?`<p style="color:var(--gr);font-weight:700;font-size:13px;margin:-2px 2px 10px">✓ ${S.promo} — ${PROMOS[S.promo]}% chegirma hisobga olindi</p>`:''}
 <div class="sum"><div><span>Tovarlar (${cartCount()} ta)</span><span>${fmt(sum)}</span></div>
 ${pd?`<div class="discrow"><span>Promokod chegirmasi</span><span>−${fmt(pd)}</span></div>`:''}
 <div><span>Yetkazish</span><span>${del?fmt(del):'Bepul 🎉'}</span></div>
 <div class="tot"><span>Jami</span><span>${fmt(sum-pd+del)}</span></div></div>
 <button class="cta" onclick="go('#/checkout')">Buyurtma berish →</button></div>`+nav('cart');
}
function setQty(id,d){S.cart[id].qty+=d;const p=byId(id);if(S.cart[id].qty>p.stock)S.cart[id].qty=p.stock;if(S.cart[id].qty<1)delete S.cart[id];save();render();}
function later(id){if(!S.favs.includes(id))S.favs.push(id);delete S.cart[id];save();toast('Sevimlilarga ko\'chirildi ❤️');render();}
function applyPromo(){const v=(document.getElementById('promo-in').value||'').trim().toUpperCase();if(PROMOS[v]){S.promo=v;save();toast('Promokod qo\'llandi ✓');render();}else toast('Bunday promokod topilmadi');}
function checkout(){
 const sum=goodsSum(),pd=promoDisc();
 const del=method==='point'?0:delFee(sum-pd);
 const eta=method==='point'?dateStr(2):dateStr(1);
 const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
 return `<button class="back" onclick="go('#/cart')">← Savatga</button><div class="page" style="padding-top:4px"><div class="ptitle">Buyurtma berish</div>
 <div class="fld"><label>Ismingiz</label><input id="f-name" placeholder="Masalan: Azizbek" value="${u?((u.first_name||'')+' '+(u.last_name||'')).trim():''}"></div>
 <div class="fld"><label>Telefon raqam</label><input id="f-phone" placeholder="+998 90 123 45 67" inputmode="tel" value="${S.phone}"></div>
 <div class="fld"><label>Yetkazish usuli</label><div class="mrow">
 <div class="meth ${method==='courier'?'on':''}" onclick="method='courier';render()"><b>${ico('home','sm')} Kuryer</b><small>Manzilga olib boramiz — ${dateStr(1)} yetadi</small></div>
 <div class="meth ${method==='point'?'on':''}" onclick="method='point';render()"><b>${ico('box','sm')} Punkt dan olish</b><small>O'zingiz olib ketasiz — bepul, ${dateStr(2)} dan tayyor</small></div></div></div>
 ${method==='courier'?`<div class="fld"><label>Manzil</label><input id="f-addr" placeholder="Ko'cha, uy, mo'ljal" value="${S.addr}"></div>`:
 `<div class="fld"><label>Qaysi punkt?</label><select id="f-point">${POINTS.map((pt,i)=>`<option value="${i}" ${pointIdx===i?'selected':''}>${pt}</option>`).join('')}</select></div>`}
 <div class="fld"><label>Izoh (ixtiyoriy)</label><input id="f-note" placeholder="Masalan: ishdan keyin, 18:00 dan so'ng qo'ng'iroq qiling"></div>
 <div class="fld"><label>To'lov usuli</label><div class="payrow">
 <div class="pay ${pay==='click'?'on':''}" onclick="pay='click';render()"><div class="plogo" style="color:#0094e8">click</div>Click<small>Havola botdan keladi</small></div>
 <div class="pay ${pay==='payme'?'on':''}" onclick="pay='payme';render()"><div class="plogo" style="color:#00c853">payme</div>Payme<small>Havola botdan keladi</small></div>
 <div class="pay ${pay==='cash'?'on':''}" onclick="pay='cash';render()"><div class="plogo" style="color:#16161a">naqd</div>Naqd<small>Olgan paytda</small></div></div></div>
 <div class="sum"><div><span>Tovarlar (${cartCount()} ta)</span><span>${fmt(sum)}</span></div>
 ${pd?`<div class="discrow"><span>Promokod ${S.promo}</span><span>−${fmt(pd)}</span></div>`:''}
 <div><span>Yetkazish (${method==='point'?'punkt':'kuryer'}, ${eta})</span><span>${del?fmt(del):'Bepul 🎉'}</span></div>
 <div class="tot"><span>Jami</span><span>${fmt(sum-pd+del)}</span></div></div>
 <button class="cta" onclick="placeOrder()">✅ Tasdiqlash — ${fmt(sum-pd+del)}</button>
 <p style="text-align:center;color:#8e8e93;font-size:12px;margin-top:9px">Tasdiqlasangiz, operator qo'ng'iroq qilib manzilni aniqlashtiradi</p></div>`+nav('');
}
function placeOrder(){
 const name=((document.getElementById('f-name')||{}).value||'').trim();
 const phone=((document.getElementById('f-phone')||{}).value||'').trim();
 const note=((document.getElementById('f-note')||{}).value||'').trim();
 if(name.length<2){toast('Ismingizni yozing');return;}
 if(phone.replace(/\D/g,'').length<9){toast('Telefon raqamni to\'liq yozing');return;}
 let addr='';
 if(method==='courier'){addr=((document.getElementById('f-addr')||{}).value||'').trim();if(addr.length<5){toast('Manzilni yozing — kuryer qayerga borsin?');return;}S.addr=addr;}
 else{pointIdx=+((document.getElementById('f-point')||{}).value||0);addr=POINTS[pointIdx];}
 S.phone=phone;
 const sum=goodsSum(),pd=promoDisc(),del=method==='point'?0:delFee(sum-pd);
 const no='AZ-'+(1042+S.orders.length);
 const items=Object.values(S.cart).map(c=>{const p=byId(c.id);return {id:p.id,img:p.imgs[0],name:p.name,opt:c.opt,qty:c.qty,price:p.price};});
 const ord={no,date:new Date().toLocaleDateString('uz-UZ'),eta:method==='point'?dateStr(2):dateStr(1),items,total:sum-pd+del,pay:pay==='cash'?'Naqd':pay==='click'?'Click':'Payme',method:method==='point'?'Punkt dan olish':'Kuryer',addr,name,phone,note,status:0,promo:S.promo};
 S.orders.unshift(ord);S.cart={};S.promo='';save();
 if(tg&&tg.sendData){try{tg.sendData(JSON.stringify({type:'order',order:{no:no,items:items.map(i=>`${i.name} (${i.opt}) ×${i.qty}`).join('<br>')+`<br>Yetkazish: ${ord.method} — ${addr}<br>Sana: ${ord.eta}`,total:ord.total,pay:ord.pay,name:name,phone:phone}}));}catch(e){}}
 go('#/done');
}
function donePage(){
 const o=S.orders[0];
 return `<div class="ok"><div class="em" style="color:var(--gr)">${ico('check','xl')}</div><h2>Rahmat, ${o?o.name.split(' ')[0]:'buyurtmangiz'} yetib keldi!</h2>
 <p>Buyurtma raqamingiz: <b>${o?o.no:''}</b><br>Operator qo'ng'iroq qiladi — manzilni aniqlashtirib, <b>${o?o.eta:''}</b> yuborib yuboramiz.<br>Holatini «Buyurtma» bo'limidan kuzatib boring.</p>
 <button class="cta" style="max-width:300px" onclick="go('#/orders')">Buyurtmalarim</button>
 <button class="cta" style="max-width:300px;background:#16161a" onclick="go('#/')">Bosh sahifaga</button></div>`+nav('');
}

 if(!S.orders.length)return `<div class="page"><div class="ptitle">Buyurtmalarim</div><div class="empty"><div class="em" style="color:#c9c9d1">${ico('box','xl')}</div><b>Hozircha buyurtma yo'q</b>Birinchi buyurtmangizga yetkazish bizdan sovg'a</div><button class="cta" onclick="go('#/')">Xaridni boshlash</button></div>`+nav('orders');
 return `<div class="page"><div class="ptitle">📦 Buyurtmalarim</div>${S.orders.map((o,oi)=>`
 <div class="ord"><div class="oh"><b>№ ${o.no}</b><span>${o.date}</span>${o.status===99?'<span class="stbadge cx">Bekor qilingan</span>':`<span class="stbadge">${STEPS[Math.min(o.status+1,4)]==='Topshirildi'?'Yetkazildi':STEPS[o.status]}</span>`}</div>
 ${o.status!==99?`<div class="tl">${STEPS.map((s,i)=>`<div class="st ${i<=o.status+1?'done':''}">${s}</div>`).join('')}</div>`:''}
 <div class="oimgs">${o.items.map(i=>`<img src="${G}${i.img}" alt="">`).join('')}</div>
 <div class="oi">${o.items.map(i=>`${i.name} — ${i.opt} ×${i.qty}`).join('<br>')}</div>
 <div class="ot">${fmt(o.total)} • ${o.pay}</div>
 <div class="om">${o.method}: ${o.addr}<br>Kutilayotgan sana: ${o.eta}${o.note?'<br>Izoh: '+o.note:''}</div>
 <div class="obtns"><button onclick="toast('Yordam: botga yozing, operator javob beradi 💬')">${ico('chat','sm')} Yordam</button>
 ${o.status===0&&o.status!==99?`<button class="cancel" onclick="cancelOrder(${oi})">Bekor qilish</button>`:''}</div></div>`).join('')}</div>`+nav('orders');
}
function cancelOrder(i){S.orders[i].status=99;save();toast('Buyurtma bekor qilindi');render();}
function favsPage(){
 const arr=S.favs.map(byId).filter(Boolean);
 return `<button class="back" onclick="go('#/profile')">← Profilga</button><div class="page" style="padding-top:2px"><div class="ptitle">Sevimlilar</div>
 ${arr.length?`<div class="grid" style="padding:0">${arr.map(card).join('')}</div>`:`<div class="empty"><div class="em" style="color:#c9c9d1">${ico('heart','xl')}</div><b>Hozircha bo'sh</b>Tovar kartasidagi yurakchani bossangiz, shu yerda chiqadi</div>`}</div>`+nav('profile');
}
function infoPage(){
 return `<button class="back" onclick="go('#/profile')">← Profilga</button><div class="page" style="padding-top:2px"><div class="ptitle">Yetkazish va qaytarish</div>
 <div class="infocard" style="margin-top:0"><b class="t">${ico('truck')} Yetkazib berish</b>
 <p style="color:#444">Toshkent bo'ylab kuryer — 1 kun, 25 000 so'm. Buyurtma 300 000 so'mdan oshsa — bepul.<br>Olib ketish punktlari: ish vaqti 09:00–21:00, yetkazish bepul, 2 kunda tayyor bo'ladi.<br>Viloyatlarga operator bilan kelishiladi.</p></div>
 <div class="infocard"><b class="t">${ico('ret')} Qaytarish</b>
 <p style="color:#444">Tovar to'g'ri kelmasa yoki nuqsoni bo'lsa, 14 kun ichida qaytarish mumkin. Pul 3 ish kunida qaytadi. Buning uchun botga yozing — operator yo'l ko'rsatadi.</p></div>
 <div class="infocard"><b class="t">${ico('cash')} To'lov</b>
 <p style="color:#444">Click va Payme — tasdiqdan keyin bot to'lov havolasini yuboradi. Naqd — tovarni olgan paytda kuryerga yoki punktda.</p></div></div>`+nav('profile');
}
function profile(){
 const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
 const nm=u?((u.first_name||'')+' '+(u.last_name||'')):S.orders[0]?S.orders[0].name:'Mehmon';
 return `<div class="page"><div class="ptitle">Profil</div>
 <div class="prof"><div class="pava" style="background:#16161a;overflow:hidden;padding:0"><img src="assets/logo-tile.png" style="width:100%;height:100%;object-fit:cover;display:block"></div><div><b style="font-size:17px">${nm}</b><div style="color:#8e8e93;font-size:13px;margin-top:2px">${u&&u.username?'@'+u.username+' • ':''}${S.phone||''}</div><div style="color:#8e8e93;font-size:12.5px">Buyurtmalar: ${S.orders.length} ta • Kanal obunachisi</div></div></div>
 <div class="fld" style="margin-top:14px"><label>Telefonim (buyurtmada avtomatik chiqadi)</label><input id="my-phone" placeholder="+998 ..." value="${S.phone}" onchange="S.phone=this.value;save();toast('Saqlandi ✓')"></div>
 ${S.addr?`<div class="infocard" style="margin-top:0"><b class="t">${ico('pin')} Saqlangan manzil</b><p style="color:#444">${S.addr}</p></div>`:''}
 <div class="menu">
 <button onclick="go('#/orders')"><span class="mi-t">${ico('box')} Buyurtmalarim</span><span>${S.orders.length||''} ›</span></button>
 <button onclick="go('#/cart')"><span class="mi-t">${ico('cart')} Savatim</span><span>${cartCount()||''} ›</span></button>
 <button onclick="go('#/favs')"><span class="mi-t">${ico('heart')} Sevimlilar</span><span>${S.favs.length||''} ›</span></button>
 <button onclick="toast('Promokodingiz: AZURA10 — savatda yozing, 10% chegirma 🎁')"><span class="mi-t">${ico('gift')} Promokodlarim</span><span>›</span></button>
 <button onclick="go('#/info')"><span class="mi-t">${ico('truck')} Yetkazish va qaytarish</span><span>›</span></button>
 <button onclick="window.open('https://t.me/azura_market_bot','_blank')"><span class="mi-t">${ico('share')} Kanalimiz va bot</span><span>›</span></button>
 <button onclick="toast('Yordam: @azura_market_bot ga yozing 💬')"><span class="mi-t">${ico('chat')} Yordam / Aloqa</span><span>›</span></button>
 </div>
 <p style="text-align:center;color:#aeaeb2;font-size:12px;margin-top:18px">Azura Market — Telegram do'koni, v5.0</p></div>`+nav('profile');
}
function render(){
 const h=location.hash||'#/';
 const app=document.getElementById('app');
 let html;
 if(h.startsWith('#/product/'))html=product(h.split('/')[2]);
 else if(h==='#/catalog')html=catalog();
 else if(h==='#/cart')html=cartPage();
 else if(h==='#/checkout')html=checkout();
 else if(h==='#/orders')html=ordersPage();
 else if(h==='#/profile')html=profile();
 else if(h==='#/favs')html=favsPage();
 else if(h==='#/info')html=infoPage();
 else if(h==='#/done')html=donePage();
 else html=home();
 app.innerHTML=html;window.scrollTo(0,0);
 if(tg&&tg.BackButton){try{['#/product/','#/checkout','#/favs','#/info'].some(x=>h.startsWith(x))?tg.BackButton.show():tg.BackButton.hide();tg.BackButton.onClick(()=>history.back());}catch(e){}}
 if(tg&&tg.MainButton){try{tg.MainButton.hide();}catch(e){}}
}
/* Kanal tugmasi: t.me/azura_market_bot?startapp=product_1 */
(function(){
 let sp='';
 try{sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||new URLSearchParams(location.search).get('startapp')||new URLSearchParams(location.search).get('start')||'';}catch(e){}
 const m=/product_(\d+)/.exec(sp||'');
 if(m&&byId(m[1]))location.hash='#/product/'+m[1];
})();
window.addEventListener('hashchange',render);
render();
</script>

<script>
let heroI=0;
function heroGo(i){heroI=i;const t=document.getElementById('htrack');if(t)t.style.transform='translateX(-'+(i*100)+'%)';document.querySelectorAll('.hdot').forEach((d,j)=>d.classList.toggle('on',j===i));}
setInterval(()=>{if(document.getElementById('htrack'))heroGo((heroI+1)%3);},4200);
setInterval(()=>{const e=document.getElementById('cd');if(!e)return;const now=new Date();const end=new Date(now);end.setDate(now.getDate()+((7-now.getDay())%7||7));end.setHours(23,59,59,999);let s=Math.max(0,Math.floor((end-now)/1000));const d=Math.floor(s/86400);s%=86400;const pad=n=>String(n).padStart(2,'0');e.textContent='Tugashiga: '+(d>0?d+' kun ':'')+pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);},1000);
</script>
