<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MARKET•UZ — Telegram Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--p:#7000FF;--pd:#5a00d1;--y:#ffe600;--bg:#f2f2f7;--red:#ff3b5c;--gr:#00a651}
body{background:var(--bg);color:#16161a;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:78px}
button{border:none;cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
/* header */
.header{background:linear-gradient(135deg,var(--p),#9b4dff);padding:14px 14px 14px;color:#fff;border-radius:0 0 20px 20px;position:sticky;top:0;z-index:30}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.logo{font-size:21px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.logo span{color:var(--y)}
.search{margin-top:11px;background:#fff;border-radius:12px;padding:11px 13px;color:#8e8e93;font-size:14px;display:flex;gap:8px;align-items:center}
.search input{border:none;outline:none;flex:1;color:#16161a;background:none}
.bell{position:relative;font-size:19px}
.bell i{position:absolute;top:-3px;right:-4px;width:9px;height:9px;background:var(--red);border-radius:50%;border:2px solid #8b3dff}
/* banner */
.banner{margin:14px;background:linear-gradient(120deg,var(--y),#ffb800);border-radius:16px;padding:16px}
.banner b{font-size:20px;display:block}
.banner small{font-size:12.5px;opacity:.75}
.banner .chip{display:inline-block;margin-top:9px;background:var(--p);color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
/* categories */
.cats{display:flex;gap:4px;padding:2px 8px 4px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{min-width:58px;text-align:center;font-size:10.5px;color:#333;cursor:pointer}
.cat .ic{width:50px;height:50px;border-radius:50%;background:#fff;overflow:hidden;margin:0 auto 5px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cat .ic img{width:100%;height:100%;object-fit:cover;display:block}
.cat.on .ic{outline:2.5px solid var(--p)}
.cat.on{color:var(--p);font-weight:700}
/* sections & grid */
.sec{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 8px}
.sec b{font-size:17px}.sec a{font-size:12.5px;color:var(--p);font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer}
.ph{height:138px;position:relative;overflow:hidden;background:#ececf1}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px}
.badge.new{background:var(--gr)}
.fav{position:absolute;top:4px;right:8px;font-size:19px;color:#c7c7cc;background:none}
.fav.on{color:var(--red)}
.info{padding:9px 10px 11px}
.price{color:var(--p);font-weight:800;font-size:15px}
.old{color:#aeaeb2;font-size:11.5px;text-decoration:line-through;margin-left:5px}
.info .old{display:block;margin:2px 0 0}
.pname{font-size:12.8px;color:#222;margin-top:4px;line-height:1.3;min-height:33px}
.rate{font-size:11px;color:#ff9500;margin-top:3px}
.add{margin-top:8px;background:var(--p);color:#fff;text-align:center;padding:9px;border-radius:9px;font-size:12.5px;font-weight:700;width:100%}
.added{background:#e9e2ff;color:var(--p)}
/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:9px 0 12px;border-top:1px solid #e8e8ec;z-index:40}
.nav button{background:none;font-size:10.5px;color:#8e8e93;text-align:center;position:relative}
.nav button div{font-size:20px;line-height:1.25}
.nav button.on{color:var(--p);font-weight:700}
.nav .cnt{position:absolute;top:-4px;right:6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* page generic */
.page{padding:14px}
.ptitle{font-size:20px;font-weight:800;margin-bottom:12px}
.back{background:none;font-size:15px;color:var(--p);font-weight:600;padding:12px 14px 0;display:block}
/* product */
.pbig{height:320px;position:relative;border-radius:0 0 22px 22px;overflow:hidden;background:#ececf1}
.pbig img{width:100%;height:100%;object-fit:cover;display:block}
.pbody{padding:16px}
.pbody .price{font-size:23px}
.pbody h2{font-size:19px;margin:8px 0 4px;line-height:1.3}
.desc{font-size:14px;color:#555;line-height:1.55;margin-top:8px}
.opt{margin-top:14px}
.opt b{font-size:13.5px;display:block;margin-bottom:8px}
.selrow{display:flex;gap:8px;flex-wrap:wrap}
.sel{padding:8px 14px;border:1.5px solid #dddde3;border-radius:10px;background:#fff;font-size:13.5px;font-weight:600}
.sel.on{border-color:var(--p);color:var(--p);background:#f4efff}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:36px;height:36px;border-radius:50%;background:#eeeef2;font-size:19px;font-weight:700}
.qty b{font-size:17px}
.buyrow{display:flex;gap:10px;margin-top:20px}
.buyrow .add{flex:1;padding:14px;font-size:15px;border-radius:12px;margin:0}
.buyrow .now{flex:1;background:#16161a;color:#fff;padding:14px;font-size:15px;border-radius:12px;font-weight:700}
.feat{display:flex;gap:8px;margin-top:16px}
.feat div{flex:1;background:#fff;border-radius:12px;padding:10px;font-size:11.5px;text-align:center;color:#444;line-height:1.4}
.feat div b{display:block;font-size:16px}
/* cart */
.crow{background:#fff;border-radius:14px;padding:11px;display:flex;gap:11px;margin-bottom:10px;align-items:center}
.cph{width:66px;height:66px;border-radius:11px;overflow:hidden;flex-shrink:0;background:#ececf1}
.cph img{width:100%;height:100%;object-fit:cover;display:block}
.crow .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.crow .vr{font-size:11.5px;color:#8e8e93;margin-top:2px}
.crow .pr{color:var(--p);font-weight:800;font-size:14px;margin-top:4px}
.del{background:none;color:#c7c7cc;font-size:17px;align-self:flex-start}
.sum{background:#fff;border-radius:14px;padding:14px;margin-top:4px;font-size:14px}
.sum div{display:flex;justify-content:space-between;padding:4px 0;color:#555}
.sum .tot{border-top:1px dashed #e3e3e8;margin-top:8px;padding-top:10px;color:#16161a;font-weight:800;font-size:16px}
.cta{width:100%;background:var(--p);color:#fff;padding:15px;border-radius:13px;font-size:15.5px;font-weight:800;margin-top:12px}
.cta:active{background:var(--pd)}
.empty{text-align:center;padding:56px 20px;color:#8e8e93}
.empty .em{font-size:64px;margin-bottom:12px}
.empty b{color:#333;display:block;font-size:17px;margin-bottom:5px}
/* form */
.fld{margin-bottom:12px}
.fld label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;padding:13px;border:1.5px solid #e0e0e6;border-radius:12px;background:#fff;outline:none}
.fld input:focus{border-color:var(--p)}
.payrow{display:flex;gap:9px}
.pay{flex:1;background:#fff;border:1.5px solid #e0e0e6;border-radius:12px;padding:13px 6px;text-align:center;font-size:13px;font-weight:700;cursor:pointer}
.pay.on{border-color:var(--p);color:var(--p);background:#f4efff}
.pay div{font-size:21px;margin-bottom:4px}
/* orders / profile */
.ord{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px}
.ord .oh{display:flex;justify-content:space-between;font-size:13px;color:#8e8e93}
.st{font-weight:700;padding:3px 9px;border-radius:12px;font-size:11.5px;background:#fff4d6;color:#9a7400}
.st.done{background:#e2f7e9;color:#0a7a37}
.ord .oi{font-size:13.5px;margin-top:8px;line-height:1.5}
.ord .ot{font-weight:800;margin-top:6px}
.prof{background:#fff;border-radius:16px;padding:18px 14px;display:flex;gap:13px;align-items:center}
.pava{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--p),#9b4dff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.menu{background:#fff;border-radius:14px;margin-top:12px;overflow:hidden}
.menu button{display:flex;width:100%;background:none;padding:15px 14px;font-size:14.5px;justify-content:space-between;border-bottom:1px solid #f2f2f5;text-align:left}
.menu button:last-child{border-bottom:none}
.ok{text-align:center;padding:48px 22px}
.ok .em{font-size:76px}
.ok h2{font-size:21px;margin:14px 0 8px}
.ok p{color:#666;font-size:14px;line-height:1.55}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:#16161a;color:#fff;padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chips{display:flex;gap:8px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip2{padding:8px 14px;border-radius:20px;background:#fff;font-size:13px;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.chip2.on{background:#16161a;color:#fff;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const PRODUCTS=[
 {id:1,img:"assets/p1.jpg",name:"Krossovka erkaklar uchun, yugurish va kundalikka, tagligi yumshoq",price:329000,old:479000,rate:"4.8",rev:316,cat:"poyabzal",tag:"-31%",desc:"Tagligi yumshoq — kun bo'yi kiysangiz ham oyoq charchamaydi. Setkasi havo o'tkazadi, yozda ham qulay. O'lchami aniq keladi: odatda qaysi o'lcham kiysangiz, o'shani tanlang.",opts:["40","41","42","43","44","45"],olab:"O'lcham"},
 {id:2,img:"assets/p2.jpg",name:"Smart soat, qo'ng'iroq qilib bo'ladi, AMOLED ekran",price:219000,old:299000,rate:"4.7",rev:189,cat:"texnika",tag:"-27%",desc:"Telefonga Bluetooth orqali ulanadi, to'g'ridan-to'g'ri soatdan gaplashsangiz bo'ladi. Puls, qadam va uyquni o'lchaydi. Zaryadi 7-10 kun yetadi, kamari qo'shimcha beriladi.",opts:["Ko'k","Qora","Kulrang"],olab:"Rang"},
 {id:3,img:"assets/p3.jpg",name:"Simsiz quloqchin, mikrofoni bor, quvvat qutisi bilan",price:119000,old:169000,rate:"4.6",rev:427,cat:"texnika",tag:"",desc:"Ovozi baland va tiniq, mikrofoni gaplashganda yaxshi eshitiladi. Qutisi bilan birga zaryadi 20 soatgacha yetadi. Barcha telefonlarga ulanadi.",opts:["Oq","Qora"],olab:"Rang"},
 {id:4,img:"assets/p4.jpg",name:"Ayollar sumkasi, tabiiy teri, yelkaga osiladigan",price:249000,old:320000,rate:"4.9",rev:98,cat:"aksessuar",tag:"",desc:"Teri yumshoq, choki tekis tikilgan. Ichiga hamyon, telefon va kosmetika bemalol sig'adi. Uzun kamari bor — yelkaga ham, qo'lga ham osiladi.",opts:["Jigarrang","Qora"],olab:"Rang"},
 {id:5,img:"assets/p5.jpg",name:"Erkaklar kurtkasi, qishki, ichi issiq, suv shimmaydi",price:459000,old:590000,rate:"4.8",rev:64,cat:"kiyim",tag:"-22%",desc:"Qish uchun: ichi qalin, sovuq o'tkazmaydi. Yomg'irda suv shimmaydi, kapyushoni bor. Cho'ntagi 4 ta. O'lcham bo'yicha savol bo'lsa, buyurtmada izoh qoldiring — o'zimiz aniqlashtiramiz.",opts:["M","L","XL","XXL"],olab:"O'lcham"},
 {id:6,img:"assets/p6.jpg",name:"Jinsi shim erkaklar uchun, klassik ko'k, bichimi to'g'ri",price:189000,old:0,rate:"4.7",rev:143,cat:"kiyim",tag:"",desc:"Denimi zich, tizzasi cho'zilib ketmaydi. Oyoqqa yaxshi o'tiradi. Krossovka bilan ham, tufli bilan ham ketadi.",opts:["30","31","32","33","34","36"],olab:"O'lcham"},
 {id:7,img:"assets/p7.jpg",name:"Ryukzak, 15.6 noutbuk sig'adi, shahar va o'qish uchun",price:159000,old:210000,rate:"4.8",rev:257,cat:"aksessuar",tag:"-24%",desc:"Noutbuk uchun alohida yumshoq bo'lmasi bor. Orqasi qotib turadi, yelka kamarlari keng — og'ir bo'lsa ham yelkani ezmaydi. Oldida kichik cho'ntagi bor.",opts:["Ko'k","Qora"],olab:"Rang"},
 {id:8,img:"assets/p8.jpg",name:"Telefon g'ilofi, zarbaga chidamli, shaffof",price:39000,old:65000,rate:"4.6",rev:812,cat:"texnika",tag:"-40%",desc:"Burchaklari kuchaytirilgan — telefon tushib ketsa ham himoya qiladi. Shaffof, orqa ko'rinishi qoladi. Kameraga alohida bo'rtma himoyasi bor. Modelni to'g'ri tanlang.",opts:["iPhone","Samsung","Xiaomi","Redmi"],olab:"Model"},
 {id:9,img:"assets/p9.jpg",name:"Kepka oq, yozgi, o'lchami orqasidan sozlanadi",price:69000,old:0,rate:"4.5",rev:76,cat:"kiyim",tag:"",desc:"Paxta aralash mato, bosh terlamaydi. Orqasidagi kamar bilan o'lcham sozlanadi. Quyoshdan yaxshi himoya qiladi.",opts:["Oq","Qora","Ko'k"],olab:"Rang"},
 {id:10,img:"assets/p10.jpg",name:"Atir 50 ml, ifori uzoq turadigan, sovg'aga ham bo'ladi",price:279000,old:350000,rate:"4.9",rev:204,cat:"aksessuar",tag:"-20%",desc:"Ifоri achchiq emas, kun davomida 6-8 soat saqlanadi. Shishasi sovg'a qutisida keladi. Ayollarga ham, erkaklarga ham to'g'ri keladigan universal ifor.",opts:["50 ml","100 ml"],olab:"Hajm"}
];
const CATS=[{k:"all",img:"assets/p1.jpg",n:"Hammasi"},{k:"kiyim",img:"assets/p5.jpg",n:"Kiyim"},{k:"poyabzal",img:"assets/p1.jpg",n:"Poyabzal"},{k:"texnika",img:"assets/p2.jpg",n:"Texnika"},{k:"aksessuar",img:"assets/p4.jpg",n:"Aksessuar"}];
let cart={}, favs=new Set(), orders=[], pay="click", selOpt={}, selQty=1;
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){tg.ready();tg.expand();}
const fmt=n=>n.toString().replace(/\B(?=(\d{3})+(?!\d))/g," ")+" so'm";
const byId=id=>PRODUCTS.find(p=>p.id===+id);
const cartCount=()=>Object.values(cart).reduce((a,c)=>a+c.qty,0);
const cartSum=()=>Object.values(cart).reduce((a,c)=>a+byId(c.id).price*c.qty,0);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800);if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');}
function go(h){location.hash=h;}
function nav(active){
 const c=cartCount();
 return `<div class="nav">
 <button class="${active==='home'?'on':''}" onclick="go('#/')"><div>🏠</div>Bosh sahifa</button>
 <button class="${active==='catalog'?'on':''}" onclick="go('#/catalog')"><div>🧭</div>Katalog</button>
 <button class="${active==='cart'?'on':''}" onclick="go('#/cart')"><div>🛒</div>Savat${c?`<span class="cnt">${c}</span>`:''}</button>
 <button class="${active==='orders'?'on':''}" onclick="go('#/orders')"><div>📦</div>Buyurtma</button>
 <button class="${active==='profile'?'on':''}" onclick="go('#/profile')"><div>👤</div>Profil</button></div>`;
}
function header(){
 return `<div class="header"><div class="top"><span>📍 Toshkent shahri</span><span class="bell">🔔<i></i></span></div>
 <div class="logo">MARKET<span>•</span>UZ</div>
 <div class="search">🔍 <input id="q" placeholder="Nima qidiryapsiz? Krossovka, soat, atir..." oninput="onSearch(this.value)"></div></div>`;
}
function card(p){
 const inCart=cart[p.id];
 return `<div class="card" onclick="go('#/product/${p.id}')">
 <div class="ph"><img src="${p.img}" alt="" loading="lazy">${p.tag?`<span class="badge ${p.tag==='YANGI'?'new':''}">${p.tag}</span>`:''}<button class="fav ${favs.has(p.id)?'on':''}" onclick="event.stopPropagation();toggleFav(${p.id})">${favs.has(p.id)?'❤️':'♡'}</button></div>
 <div class="info"><span class="price">${fmt(p.price)}</span>${p.old?`<span class="old">${fmt(p.old)}</span>`:''}
 <div class="pname">${p.name}</div><div class="rate">★ ${p.rate} (${p.rev})</div>
 <button class="add ${inCart?'added':''}" onclick="event.stopPropagation();quickAdd(${p.id})">${inCart?'✓ Savatda ('+inCart.qty+')':'🛒 Savatga'}</button></div></div>`;
}
let filterCat="all", query="";
function onSearch(v){query=v.toLowerCase();const g=document.getElementById('grid');if(g)g.innerHTML=filtered().map(card).join('')||emptyGrid();}
function filtered(){return PRODUCTS.filter(p=>(filterCat==="all"||p.cat===filterCat)&&p.name.toLowerCase().includes(query));}
function emptyGrid(){return `<div class="empty" style="grid-column:1/-1"><div class="em">🔍</div><b>Topilmadi</b>Boshqa so'z bilan qidirib ko'ring</div>`;}
function setCat(k){filterCat=k;render();}
function home(){
 filterCat=filterCat||"all";
 return header()+`
 <div class="banner"><b>Juma chegirmasi 🛍</b><small>Krossovkalar 329 mingdan — hafta oxirigacha</small><br><span class="chip">Ko'rish →</span></div>
 <div class="cats">${CATS.map(c=>`<div class="cat ${filterCat===c.k?'on':''}" onclick="setCat('${c.k}')"><div class="ic"><img src="${c.img}" alt=""></div>${c.n}</div>`).join('')}</div>
 <div class="sec"><b>Ko'p sotilayotganlar</b><a onclick="go('#/catalog')">Hammasi →</a></div>
 <div class="grid" id="grid">${filtered().map(card).join('')||emptyGrid()}</div>`+nav('home');
}
function catalog(){
 return header()+`<div class="sec" style="padding-top:16px"><b>🧭 Katalog</b></div>
 <div class="chips">${CATS.map(c=>`<button class="chip2 ${filterCat===c.k?'on':''}" onclick="setCat('${c.k}')">${c.n}</button>`).join('')}</div>
 <div class="grid" id="grid">${filtered().map(card).join('')||emptyGrid()}</div>`+nav('catalog');
}
function product(id){
 const p=byId(id);if(!p)return home();
 if(selOpt[p.id]===undefined)selOpt[p.id]=p.opts[0];selQty=cart[p.id]?cart[p.id].qty:1;
 const inCart=cart[p.id];
 return `<button class="back" onclick="history.back()">← Orqaga</button>
 <div class="pbig"><img src="${p.img}" alt="">${p.tag?`<span class="badge ${p.tag==='YANGI'?'new':''}" style="font-size:13px;padding:5px 10px">${p.tag}</span>`:''}</div>
 <div class="pbody">
 <span class="price">${fmt(p.price)}</span>${p.old?`<span class="old" style="font-size:14px">${fmt(p.old)}</span>`:''}
 <h2>${p.name}</h2><div class="rate" style="font-size:13px">★ ${p.rate} • ${p.rev} ta sharh</div>
 <p class="desc">${p.desc}</p>
 <div class="opt"><b>${p.olab}:</b><div class="selrow">${p.opts.map(o=>`<button class="sel ${selOpt[p.id]===o?'on':''}" onclick="selOpt[${p.id}]='${o}';render()">${o}</button>`).join('')}</div></div>
 <div class="opt"><b>Miqdor:</b><div class="qty"><button onclick="selQty=Math.max(1,selQty-1);render()">−</button><b>${selQty}</b><button onclick="selQty++;render()">+</button></div></div>
 <div class="buyrow"><button class="add" onclick="addCart(${p.id},true)">${inCart?'✓ Savatda — yangilash':'🛒 Savatga qo\'shish'}</button><button class="now" onclick="buyNow(${p.id})">Hoziroq olish</button></div>
 <div class="feat"><div><b>🚚</b>Yetkazish<br>1–2 kun, bepul*</div><div><b>↩️</b>Qaytarish<br>14 kun ichida</div><div><b>🛡️</b>Kafolat<br>Rasmiy</div></div>
 </div>`+nav('');
}
function addCart(id,stay){const p=byId(id);cart[id]={id,qty:selQty,opt:selOpt[id]||p.opts[0]};toast('Savatga tushdi ✓');render();}
function buyNow(id){addCartSilent(id);go('#/checkout');}
function addCartSilent(id){const p=byId(id);cart[id]={id,qty:selQty,opt:selOpt[id]||p.opts[0]};}
function quickAdd(id){const p=byId(id);if(cart[id])cart[id].qty++;else cart[id]={id,qty:1,opt:p.opts[0]};toast('Savatga tushdi ✓');render();}
function toggleFav(id){favs.has(id)?favs.delete(id):favs.add(id);render();}
function setQty(id,d){cart[id].qty+=d;if(cart[id].qty<1)delete cart[id];render();}
function cartPage(){
 const items=Object.values(cart);
 if(!items.length)return `<div class="page"><div class="ptitle">🛒 Savat</div><div class="empty"><div class="em">🛒</div><b>Savat hozircha bo'sh</b>Yangi tovarlar kelgan, bir ko'rib chiqing</div><button class="cta" onclick="go('#/catalog')">Katalogga o'tish</button></div>`+nav('cart');
 const sum=cartSum(),del=sum>=300000?0:25000;
 return `<div class="page"><div class="ptitle">🛒 Savat</div>
 ${items.map(c=>{const p=byId(c.id);return `<div class="crow"><div class="cph"><img src="${p.img}" alt=""></div>
 <div style="flex:1"><div class="nm">${p.name}</div><div class="vr">${p.olab}: ${c.opt}</div><div class="pr">${fmt(p.price*c.qty)}</div></div>
 <div class="qty"><button onclick="setQty(${p.id},-1)">−</button><b>${c.qty}</b><button onclick="setQty(${p.id},1)">+</button></div>
 <button class="del" onclick="delete cart[${p.id}];render()">✕</button></div>`;}).join('')}
 <div class="sum"><div><span>Tovarlar</span><span>${fmt(sum)}</span></div><div><span>Yetkazish</span><span>${del?fmt(del):'Bepul 🎉'}</span></div>
 <div class="tot"><span>Jami</span><span>${fmt(sum+del)}</span></div></div>
 <button class="cta" onclick="go('#/checkout')">Buyurtma berish →</button>
 <p style="text-align:center;color:#8e8e93;font-size:12px;margin-top:10px">300 000 so'mdan oshsa yetkazish bepul</p></div>`+nav('cart');
}
function checkout(){
 const sum=cartSum(),del=sum>=300000?0:25000;
 return `<button class="back" onclick="go('#/cart')">← Savatga</button><div class="page" style="padding-top:6px"><div class="ptitle">📋 Buyurtma berish</div>
 <div class="fld"><label>Ismingiz</label><input id="f-name" placeholder="Masalan: Azizbek"></div>
 <div class="fld"><label>Telefon</label><input id="f-phone" placeholder="+998 __ ___ __ __" inputmode="tel"></div>
 <div class="fld"><label>Manzil</label><input id="f-addr" placeholder="Shahar, ko'cha, uy"></div>
 <div class="fld"><label>To'lov usuli</label><div class="payrow">
 <div class="pay ${pay==='click'?'on':''}" onclick="pay='click';render()"><div>💳</div>Click</div>
 <div class="pay ${pay==='payme'?'on':''}" onclick="pay='payme';render()"><div>🟢</div>Payme</div>
 <div class="pay ${pay==='cash'?'on':''}" onclick="pay='cash';render()"><div>💵</div>Naqd</div></div></div>
 <div class="sum"><div><span>Tovarlar (${cartCount()} ta)</span><span>${fmt(sum)}</span></div><div><span>Yetkazish</span><span>${del?fmt(del):'Bepul 🎉'}</span></div><div class="tot"><span>Jami</span><span>${fmt(sum+del)}</span></div></div>
 <button class="cta" onclick="placeOrder()">✅ Tasdiqlash — ${fmt(sum+del)}</button></div>`+nav('');
}
function placeOrder(){
 const name=(document.getElementById('f-name')||{}).value||"Mijoz";
 const phone=(document.getElementById('f-phone')||{}).value||"";
 if(!phone){toast('Telefon raqamingizni yozing, qo\'ng\'iroq qilamiz');return;}
 const sum=cartSum(),del=sum>=300000?0:25000;
 const ord={no:1000+orders.length+1,items:Object.values(cart).map(c=>{const p=byId(c.id);return `${p.name} ×${c.qty}`;}).join('<br>'),total:sum+del,pay:pay==='cash'?'Naqd':pay==='click'?'Click':'Payme',name,status:'Qabul qilindi',date:new Date().toLocaleString('uz-UZ')};
 orders.unshift(ord);cart={};
 if(tg){tg.sendData&&tg.sendData(JSON.stringify({type:'order',order:ord}));}
 go('#/done');
}
function donePage(){
 const o=orders[0];
 return `<div class="ok"><div class="em">✅</div><h2>Rahmat, buyurtmangiz yetib keldi! 🎉</h2>
 <p>Buyurtma № <b>${o?o.no:''}</b><br>Endi operator qo'ng'iroq qiladi — manzilni aniqlashtirib, yuborib yuboramiz.<br>Holati «Buyurtma» bo'limida ko'rinadi.</p>
 <button class="cta" style="max-width:300px" onclick="go('#/orders')">📦 Buyurtmalarim</button>
 <button class="cta" style="max-width:300px;background:#16161a" onclick="go('#/')">🏠 Bosh sahifaga</button></div>`+nav('');
}
function ordersPage(){
 if(!orders.length)return `<div class="page"><div class="ptitle">📦 Buyurtmalarim</div><div class="empty"><div class="em">📦</div><b>Hozircha buyurtma yo'q</b>Birinchi buyurtmangizga yetkazish bizdan sovg'a</div><button class="cta" onclick="go('#/')">Xaridni boshlash</button></div>`+nav('orders');
 return `<div class="page"><div class="ptitle">📦 Buyurtmalarim</div>${orders.map(o=>`<div class="ord"><div class="oh"><span>№ ${o.no} • ${o.date}</span><span class="st">${o.status}</span></div><div class="oi">${o.items}</div><div class="ot">${fmt(o.total)} • ${o.pay}</div></div>`).join('')}</div>`+nav('orders');
}
function profile(){
 const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
 const nm=u?(u.first_name+' '+(u.last_name||'')):orders[0]?orders[0].name:'Mehmon';
 return `<div class="page"><div class="ptitle">👤 Profil</div>
 <div class="prof"><div class="pava">${(nm||'M').trim()[0].toUpperCase()}</div><div><b style="font-size:17px">${nm}</b><div style="color:#8e8e93;font-size:13px;margin-top:2px">${u?'@'+(u.username||''):''} • Kanal obunachisi ⭐</div></div></div>
 <div class="menu">
 <button onclick="go('#/orders')"><span>📦 Buyurtmalarim</span><span>›</span></button>
 <button onclick="go('#/cart')"><span>🛒 Savatim</span><span>${cartCount()||''} ›</span></button>
 <button onclick="toast('Sevimlilar: '+favs.size+' ta ❤️')"><span>❤️ Sevimlilar</span><span>${favs.size||''} ›</span></button>
 <button onclick="toast('Promokod: KANAL10 — 10% chegirma 🎁')"><span>🎁 Promokodlarim</span><span>›</span></button>
 <button onclick="toast('Yetkazish: Toshkent 1 kun, viloyatlar 2-3 kun 🚚')"><span>🚚 Yetkazish haqida</span><span>›</span></button>
 <button onclick="toast('Yordam: @market_support ga yozing 💬')"><span>💬 Yordam / Aloqa</span><span>›</span></button>
 </div>
 <p style="text-align:center;color:#aeaeb2;font-size:12px;margin-top:18px">MARKET•UZ — Telegram Mini App v1.0</p></div>`+nav('profile');
}
function render(){
 const h=location.hash||'#/';
 const app=document.getElementById('app');
 let html;
 if(h.startsWith('#/product/'))html=product(h.split('/')[2]);
 else if(h==='#/catalog')html=catalog();
 else if(h==='#/cart')html=cartPage();
 else if(h==='#/checkout')html=checkout();
 else if(h==='#/orders')html=ordersPage();
 else if(h==='#/profile')html=profile();
 else if(h==='#/done')html=donePage();
 else html=home();
 app.innerHTML=html;window.scrollTo(0,0);
 if(tg&&tg.BackButton){['#/product/','#/checkout'].some(x=>h.startsWith(x))?tg.BackButton.show():tg.BackButton.hide();tg.BackButton.onClick(()=>history.back());}
}
/* Kanal tugmasidan kelish: t.me/bot/app?startapp=product_1 yoki ?startapp=product_1 */
(function(){
 let sp='';
 try{sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||new URLSearchParams(location.search).get('startapp')||new URLSearchParams(location.search).get('start')||'';}catch(e){}
 const m=/product_(\d+)/.exec(sp||'');
 if(m&&byId(m[1]))location.hash='#/product/'+m[1];
})();
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
